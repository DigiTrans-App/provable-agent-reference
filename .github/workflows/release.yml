name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  # All release lines share this lock so an older release cannot overwrite Latest.
  group: release-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools>=83' wheel
          python -m pip install '.[dev,openai]'
      - name: Verify release source and metadata
        id: verify
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          # Fetch only main here. The verifier fetches the single allow-listed
          # maintenance branch for the tag's release line, never a wildcard.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python scripts/verify_release.py \
            --tag "${RELEASE_TAG}" \
            --commit "${RELEASE_COMMIT}" \
            --main-ref refs/remotes/origin/main \
            --release-lines .github/release-lines.json
      - name: Run release validation
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          python -m unittest discover -s tests -v
          python -m pip_audit --local --skip-editable
          python scripts/validate_repo.py
          python evals/run_local.py
          ruff check .
      - name: Build distributions
        run: python -m build
      - name: Validate distributions and generate manifests
        run: |
          python scripts/validate_dist.py > dist/ARTIFACTS.json
          cd dist
          sha256sum *.whl *.tar.gz ARTIFACTS.json > SHA256SUMS
      - name: Install and test built distributions
        env:
          HYPOTHESIS_PROFILE: ci
        run: python scripts/check_built_distributions.py
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/ARTIFACTS.json
            dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_LATEST: ${{ steps.verify.outputs.latest }}
          RELEASE_PRERELEASE: ${{ steps.verify.outputs.prerelease }}
        run: |
          # Labels come from the verifier and are set once at creation.
          case "${RELEASE_LATEST}" in true|false) ;; *) echo "invalid latest flag" >&2; exit 1 ;; esac
          case "${RELEASE_PRERELEASE}" in true|false) ;; *) echo "invalid prerelease flag" >&2; exit 1 ;; esac
          flags=("--latest=${RELEASE_LATEST}")
          if [ "${RELEASE_PRERELEASE}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/ARTIFACTS.json \
            dist/SHA256SUMS \
            --verify-tag \
            "${flags[@]}" \
            --title "Provable Agent Reference Framework ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
