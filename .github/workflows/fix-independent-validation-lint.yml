name: Fix independent validation lint once

on:
  push:
    branches: [feat/independent-validation-kit]
    paths:
      - ".github/workflows/fix-independent-validation-lint.yml"

permissions:
  contents: write

jobs:
  fix:
    name: Apply bounded Ruff fixes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: feat/independent-validation-kit
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/independent-validation-kit
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Apply and verify Ruff fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.16.1'
          ruff check --fix \
            scripts/external_validation/runner.py \
            scripts/run_external_validation.py
          ruff check \
            scripts/external_validation/runner.py \
            scripts/run_external_validation.py
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            scripts/external_validation/runner.py \
            scripts/run_external_validation.py | sort)"
          test "${actual}" = "${expected}"
      - name: Commit fixed files through Contents API
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            scripts/external_validation/runner.py \
            scripts/run_external_validation.py
          do
            current_sha="$(gh api \
              "/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${TARGET_BRANCH}" \
              --jq '.sha')"
            content="$(base64 -w0 "${path}")"
            jq -n \
              --arg message "fix(validation): apply Ruff lint fixes" \
              --arg content "${content}" \
              --arg sha "${current_sha}" \
              --arg branch "${TARGET_BRANCH}" \
              '{message: $message, content: $content, sha: $sha, branch: $branch}' \
              > /tmp/update.json
            gh api --method PUT \
              "/repos/${GITHUB_REPOSITORY}/contents/${path}" \
              --input /tmp/update.json > /tmp/update-result.json
          done
