name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Repository validation
        run: python scripts/validate_repo.py
      - name: Local evaluation suite
        run: python evals/run_local.py
      - name: Preview lint fixes
        run: ruff check . --fix --diff > /tmp/ruff-fix.diff || true
      - name: Upload lint fix preview
        uses: actions/upload-artifact@v4
        with:
          name: ruff-fix-${{ matrix.python-version }}
          path: /tmp/ruff-fix.diff
      - name: Demo
        run: python -m provable_agent_reference > /tmp/provable-agent-reference-demo.json
