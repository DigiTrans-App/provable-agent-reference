name: Validate

on:
  push:
    branches: [main, "release/*.*.x"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip 'setuptools>=83' wheel
          python -m pip install -e '.[dev,openai]'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Dependency vulnerability audit
        run: python -m pip_audit --local --skip-editable
      - name: Repository validation
        run: python scripts/validate_repo.py
      - name: Local evaluation suite
        run: python evals/run_local.py
      - name: Lint
        run: ruff check .
      - name: Build and validate distributions
        run: |
          python -m build
          python scripts/validate_dist.py
      - name: Demo
        run: python -m provable_agent_reference > /tmp/provable-agent-reference-demo.json
