name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,openai]'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Repository validation
        run: python scripts/validate_repo.py
      - name: Local evaluation suite
        run: python evals/run_local.py
      - name: Lint
        run: ruff check .
      - name: Independent validation runner
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python scripts/run_external_validation.py \
            --expected-commit "${EXPECTED_COMMIT}" \
            --output /tmp/independent-validation-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          from scripts.external_validation.runner import report_digest

          report_path = Path("/tmp/independent-validation-report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          schema = json.loads(
              Path("schemas/independent-validation-report.schema.json").read_text(
                  encoding="utf-8"
              )
          )
          Draft202012Validator.check_schema(schema)
          errors = sorted(
              Draft202012Validator(schema).iter_errors(report),
              key=lambda error: list(error.path),
          )
          if errors:
              details = "; ".join(
                  f"{'.'.join(map(str, error.path)) or '<root>'}: {error.message}"
                  for error in errors
              )
              raise SystemExit(f"independent validation report is invalid: {details}")

          claimed_digest = report["report_sha256"]
          digest_input = dict(report)
          del digest_input["report_sha256"]
          actual_digest = report_digest(digest_input)
          if actual_digest != claimed_digest:
              raise SystemExit(
                  f"report digest mismatch: {actual_digest} != {claimed_digest}"
              )
          PY
      - name: Build and validate distributions
        run: |
          python -m build
          python scripts/validate_dist.py
      - name: Demo
        run: python -m provable_agent_reference > /tmp/provable-agent-reference-demo.json
