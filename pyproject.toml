[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provable-agent-reference"
version = "0.1.0"
description = "Provider-neutral reference framework for evidence-bound and independently verifiable AI-agent outputs."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "DigiTrans LLC"}]
keywords = ["ai-agents", "assurance", "audit", "authorization", "evidence", "governance", "provenance", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.23,<5", "ruff>=0.9,<1"]
openai = ["openai-agents>=0.18.3,<0.19", "pydantic>=2.10,<3"]

[project.urls]
Homepage = "https://github.com/DigiTrans-App/provable-agent-reference"
Repository = "https://github.com/DigiTrans-App/provable-agent-reference"
Issues = "https://github.com/DigiTrans-App/provable-agent-reference/issues"

[project.scripts]
provable-agent-reference = "provable_agent_reference.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
