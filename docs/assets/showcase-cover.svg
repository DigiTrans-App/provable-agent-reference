<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Provable Agent Reference Framework</title>
  <desc id="desc">A provider-neutral technical diagram showing bounded model output moving through trusted compilation, deterministic verification, human approval, exact-use authorization, and an audit manifest.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1d33"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#162a43"/>
      <stop offset="1" stop-color="#102238"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1330" cy="95" r="290" fill="#4338ca" opacity="0.10"/>
  <circle cx="230" cy="820" r="330" fill="#0891b2" opacity="0.08"/>

  <g transform="translate(96 72)">
    <rect x="0" y="0" width="1408" height="756" rx="30" fill="#0b1627" fill-opacity="0.78" stroke="#334155" stroke-opacity="0.72" filter="url(#shadow)"/>
    <rect x="0" y="0" width="1408" height="8" rx="4" fill="url(#accent)"/>

    <text x="64" y="92" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3.2">OPEN-SOURCE • PROVIDER-NEUTRAL • REPRODUCIBLE</text>
    <text x="64" y="160" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="54" font-weight="760">Provable Agent Reference Framework</text>
    <text x="64" y="207" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">Evidence-bound AI outputs with deterministic controls and independent verification.</text>

    <g transform="translate(64 270)">
      <rect x="0" y="0" width="262" height="158" rx="22" fill="#171f2d" stroke="#fb7185" stroke-opacity="0.55"/>
      <rect x="20" y="20" width="88" height="28" rx="14" fill="#7f1d1d" fill-opacity="0.55"/>
      <text x="64" y="40" text-anchor="middle" fill="#fecdd3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">UNTRUSTED</text>
      <text x="24" y="86" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Model or runtime</text>
      <text x="24" y="118" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Bounded semantic draft</text>
      <text x="24" y="145" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">No authority over identity or scope</text>

      <path d="M278 79H343" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

      <rect x="364" y="0" width="220" height="158" rx="22" fill="url(#node)" stroke="#38bdf8" stroke-opacity="0.66"/>
      <circle cx="400" cy="37" r="15" fill="#0ea5e9" opacity="0.78"/>
      <path d="M393 37l5 5 10-12" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="388" y="86" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Trusted compiler</text>
      <text x="388" y="118" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Canonical candidate</text>
      <text x="388" y="144" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Scoped evidence bindings</text>

      <path d="M600 79H653" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

      <rect x="674" y="0" width="220" height="158" rx="22" fill="url(#node)" stroke="#818cf8" stroke-opacity="0.72"/>
      <circle cx="710" cy="37" r="15" fill="#6366f1" opacity="0.82"/>
      <path d="M702 37h16M710 29v16" stroke="#eef2ff" stroke-width="3" stroke-linecap="round"/>
      <text x="698" y="86" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Verifier</text>
      <text x="698" y="118" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Deterministic findings</text>
      <text x="698" y="144" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Fail closed on mismatch</text>

      <path d="M910 79H963" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

      <rect x="984" y="0" width="220" height="158" rx="22" fill="url(#node)" stroke="#c084fc" stroke-opacity="0.72"/>
      <circle cx="1020" cy="37" r="15" fill="#9333ea" opacity="0.82"/>
      <path d="M1012 39c5-8 12-8 17 0M1016 32a4 4 0 1 0 8 0" fill="none" stroke="#faf5ff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="1008" y="86" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Human approval</text>
      <text x="1008" y="118" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Exact candidate hash</text>
      <text x="1008" y="144" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Accountable decision</text>

      <path d="M1094 174V218" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

      <rect x="984" y="238" width="220" height="146" rx="22" fill="url(#node)" stroke="#f59e0b" stroke-opacity="0.70"/>
      <circle cx="1020" cy="275" r="15" fill="#d97706" opacity="0.82"/>
      <path d="M1012 275h16M1020 267v16" stroke="#fffbeb" stroke-width="3" stroke-linecap="round"/>
      <text x="1008" y="324" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Exact-use authorization</text>
      <text x="1008" y="354" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Purpose • audience • output</text>

      <path d="M968 311H908" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

      <rect x="674" y="238" width="220" height="146" rx="22" fill="url(#node)" stroke="#22c55e" stroke-opacity="0.65"/>
      <circle cx="710" cy="275" r="15" fill="#16a34a" opacity="0.82"/>
      <path d="M702 275l6 6 11-13" fill="none" stroke="#f0fdf4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="698" y="324" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Authorized output</text>
      <text x="698" y="354" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">One bounded consequential use</text>

      <path d="M658 311H598" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

      <rect x="364" y="238" width="220" height="146" rx="22" fill="#122033" stroke="#94a3b8" stroke-opacity="0.58"/>
      <circle cx="400" cy="275" r="15" fill="#475569" opacity="0.9"/>
      <path d="M393 269h14M393 275h14M393 281h10" stroke="#f1f5f9" stroke-width="2.5" stroke-linecap="round"/>
      <text x="388" y="324" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Audit manifest</text>
      <text x="388" y="354" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Tamper-evident reconstruction</text>

      <path d="M364 311H298" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

      <rect x="0" y="238" width="278" height="146" rx="22" fill="#0f2434" stroke="#06b6d4" stroke-opacity="0.56"/>
      <text x="24" y="280" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">OPTIONAL RUNTIME ADAPTER</text>
      <text x="24" y="322" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700">Codex evidence</text>
      <text x="24" y="351" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Privacy-minimized lifecycle events</text>
      <text x="24" y="376" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Unavailable evidence stays unavailable</text>
    </g>

    <g transform="translate(64 690)">
      <rect x="0" y="0" width="312" height="42" rx="21" fill="#0c4a6e" fill-opacity="0.42" stroke="#38bdf8" stroke-opacity="0.42"/>
      <text x="156" y="27" text-anchor="middle" fill="#bae6fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">Synthetic • offline by default</text>
      <rect x="330" y="0" width="292" height="42" rx="21" fill="#312e81" fill-opacity="0.42" stroke="#818cf8" stroke-opacity="0.42"/>
      <text x="476" y="27" text-anchor="middle" fill="#c7d2fe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">40 tests + adversarial evals</text>
      <rect x="640" y="0" width="310" height="42" rx="21" fill="#581c87" fill-opacity="0.36" stroke="#c084fc" stroke-opacity="0.42"/>
      <text x="795" y="27" text-anchor="middle" fill="#e9d5ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">Independent validation kit</text>
      <rect x="968" y="0" width="244" height="42" rx="21" fill="#3f2a08" fill-opacity="0.52" stroke="#f59e0b" stroke-opacity="0.42"/>
      <text x="1090" y="27" text-anchor="middle" fill="#fde68a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">Apache-2.0 • v0.2.0</text>
      <text x="1405" y="27" text-anchor="end" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">github.com/DigiTrans-App/provable-agent-reference</text>
    </g>
  </g>
</svg>
