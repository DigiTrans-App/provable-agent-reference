services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: provable_agent_synthetic
      POSTGRES_USER: par_local
      POSTGRES_PASSWORD: local-synthetic-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U par_local -d provable_agent_synthetic"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks: [control-plane]

  control-plane:
    build:
      context: .
      dockerfile: docker/control-plane.Dockerfile
    environment:
      PAR_ENVIRONMENT: local-synthetic
      PAR_DATABASE_URL: postgresql://par_local:local-synthetic-only@postgres:5432/provable_agent_synthetic
      PAR_ARTIFACT_ROOT: /var/lib/provable-agent/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "provable_agent_reference.control_plane.health"]
    healthcheck:
      test: ["CMD", "python", "-m", "provable_agent_reference.control_plane.health"]
      interval: 5s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - artifact-data:/var/lib/provable-agent/artifacts
    networks: [control-plane]

networks:
  control-plane:
    internal: true

volumes:
  postgres-data:
  artifact-data:
